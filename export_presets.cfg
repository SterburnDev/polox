html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"theme-color\" content=\"#120e24\">
<meta name=\"referrer\" content=\"no-referrer\">
<style>
html, body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: #120e24; }
#canvas { touch-action: none; }
#polox-kb { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 8px; z-index: 10; background: #1d1736; border-top: 3px solid #f3e9d2;
  padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
#polox-kb, #polox-kb * { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
#polox-kb input { flex: 1; min-width: 0; min-height: 48px; font-size: 18px; padding: 10px 12px; border-radius: 12px; border: 2px solid #b8aed6; background: #120e24; color: #f3e9d2; }
#polox-kb button { min-width: 88px; min-height: 48px; font-size: 18px; border-radius: 12px; border: 3px solid #ffd166; background: #ffd166; color: #120e24; }
</style>
<script>
(function () {
  // The page itself must not zoom or bounce: pinches and drags belong to the game.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  // Browsers only allow sound after a tap: remember every audio context and wake them on the first one.
  var contexts = [];
  var AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    var Tracked = function (opts) { var c = new AC(opts); contexts.push(c); return c; };
    Tracked.prototype = AC.prototype;
    window.AudioContext = Tracked;
    window.webkitAudioContext = Tracked;
  }
  function wake() { contexts.forEach(function (c) { if (c.state === 'suspended') { c.resume(); } }); }
  ['touchend', 'mousedown', 'keydown'].forEach(function (t) { document.addEventListener(t, wake, true); });
  // The chat text bar (scripts/phone/phone_mode.gd): a real page input, so phone keyboards open every time.
  window.poloxKeyboard = {
    bar: null, input: null,
    build: function () {
      var bar = document.createElement('div'); bar.id = 'polox-kb';
      var input = document.createElement('input'); input.type = 'text'; input.maxLength = 600; input.enterKeyHint = 'send';
      var send = document.createElement('button'); send.type = 'button'; send.textContent = 'Send';
      var go = function () {
        var t = input.value.trim();
        if (t && window.poloxOnSend) { window.poloxOnSend(t); input.value = ''; input.blur(); window.poloxKeyboard.hide(); }
      };
      send.addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
      bar.appendChild(input); bar.appendChild(send); document.body.appendChild(bar);
      this.bar = bar; this.input = input;
    },
    show: function (placeholder) { if (!this.bar) { this.build(); } this.input.placeholder = placeholder || ''; this.bar.style.display = 'flex'; },
    hide: function () { if (this.bar) { this.bar.style.display = 'none'; } }
  };
})();
</script>"

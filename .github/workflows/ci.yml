name: Polox Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Privacy, Artwork & Script Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify public secret SVG artwork matches generator
        run: python tools/art/make_secret_yams.py --check

      - name: Run privacy & secret-leak scan
        run: python tools/release/make_public_source.py --check-checkout

      - name: Syntax-check Python helper & release scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('tools').rglob('*.py')]"
